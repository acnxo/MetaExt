name: CICD

# 构建与单元测试：所有分支的推送与 PR 都跑一遍，保证 dev 与 main 不接受坏代码。
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 构建与单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          # 版本以 go.mod 为准，避免 CI 与本地工具链不一致。
          go-version-file: go.mod
          cache: true

      - name: 校验依赖
        run: go mod verify

      - name: 格式检查
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未按 gofmt 格式化："
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt 检查通过"

      - name: 静态检查
        run: go vet ./...

      - name: 构建
        run: go build ./...

      - name: 单元测试
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: 交易日历按周输出
        # 该用例把整份日历按周一至周五逐周打印，默认不显示 t.Log，
        # 这里单独加 -v 跑一次，并同步写入运行摘要，便于人工核对数据。
        run: |
          set -euo pipefail
          go test ./component/quote/sina/finance/cnatradecalendar \
            -run TestTradeCalendarWeeklyLayout -v -count=1 | tee calendar-layout.log
          {
            echo "### 交易日历按周输出"
            echo
            echo '```text'
            awk 'length($0) == 56' calendar-layout.log | sed 's/^        //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 覆盖率摘要
        run: |
          summary="$(go tool cover -func=coverage.out | tail -n 1)"
          echo "$summary"
          {
            echo "### 单元测试覆盖率"
            echo '```'
            echo "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
          if-no-files-found: error
