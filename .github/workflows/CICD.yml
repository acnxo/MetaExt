name: CICD

# 构建与单元测试：所有分支的推送与 PR 都跑一遍，保证 dev 与 main 不接受坏代码。
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 构建与单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          # 版本以 go.mod 为准，避免 CI 与本地工具链不一致。
          go-version-file: go.mod
          cache: true
          # 项目当前无第三方依赖，没有 go.sum；用 go.mod 作为缓存键，避免缓存步骤告警。
          cache-dependency-path: go.mod

      - name: 校验依赖
        run: go mod verify

      - name: 格式检查
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未按 gofmt 格式化："
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt 检查通过"

      - name: 静态检查
        run: go vet ./...

      - name: 构建
        # 版本号以根目录 VERSION 为准，构建时注入到 base/version 包。
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          go build -ldflags "-X github.com/acnxo/MetaExt/base/version.injected=${version}" ./...

      - name: 单元测试
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: 交易日历按周输出
        # 该用例把整份日历按周一至周五逐周打印，有 1830 行，默认不显示 t.Log。
        # 为避免每次运行都刷满日志，只有第 10、20、30… 次运行才展开表格；
        # 其余运行只跑断言不输出，手动触发（workflow_dispatch）时始终展开。
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          run_number="${RUN_NUMBER:-0}"
          event="${GITHUB_EVENT_NAME:-local}"
          if [ "$event" != "workflow_dispatch" ] && [ $((run_number % 10)) -ne 0 ]; then
            go test ./component/quote/sina/finance/cnatradecalendar \
              -run TestTradeCalendarWeeklyLayout -count=1
            echo "第 ${run_number} 次运行，完整表格每 10 次输出一次，本次只校验不展开。"
            exit 0
          fi
          go test ./component/quote/sina/finance/cnatradecalendar \
            -run TestTradeCalendarWeeklyLayout -v -count=1 | tee calendar-layout.log
          {
            echo "### 交易日历按周输出"
            echo
            echo '```text'
            grep -E '^ {8}Y[0-9]{4}W[0-9]{2}' calendar-layout.log | sed 's/^        //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 覆盖率摘要
        run: |
          summary="$(go tool cover -func=coverage.out | tail -n 1)"
          echo "$summary"
          {
            echo "### 单元测试覆盖率"
            echo '```'
            echo "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
          if-no-files-found: error
