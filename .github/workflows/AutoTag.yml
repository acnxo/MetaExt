name: AutoTag

# 合并到 main 后按根目录 VERSION 文件自动打 tag 并创建 Release。
# 版本号唯一来源是 VERSION（内容形如 0.1.1，不带 v 前缀），标签已存在时跳过，
# 因此可以重复触发；也可用 workflow_dispatch 手动补打。
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag-and-release:
    name: 按 VERSION 打 tag 并创建 Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 生成变更说明需要完整历史与标签。
          fetch-depth: 0

      - name: 读取版本号
        id: version
        run: |
          set -euo pipefail
          if [ ! -f VERSION ]; then
            echo "未找到 VERSION 文件，跳过。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          raw="$(tr -d '[:space:]' < VERSION)"
          tag="v${raw#[vV]}"
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9a-z.]+)?$'; then
            echo "VERSION 内容「${raw}」不是合法版本号，跳过。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "VERSION 声明的版本：${raw}，对应标签 ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 打 tag 并创建 Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "标签 ${TAG} 已存在，跳过，避免重复发布。"
            exit 0
          fi
          git tag -a "${TAG}" -m "${TAG}：由 VERSION 文件声明"
          git push origin "${TAG}"
          # 由 GITHUB_TOKEN 推送的标签不会再次触发 Release 工作流，
          # 因此在这里直接创建 Release。
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            --verify-tag
          echo "已发布 ${TAG}"
