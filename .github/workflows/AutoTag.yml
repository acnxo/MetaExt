name: AutoTag

# 只有 dev 分支的 PR 合并进 main 时，才按根目录 VERSION 自动打 tag 并创建 Release。
# 其它来源的合并（直接推送到 main、feat/* 指向 main 的 PR）一律不触发，避免误发版本。
# 版本号唯一来源是 VERSION（内容形如 0.1.1，不带 v 前缀），标签已存在时跳过，
# 因此可重复触发；也可用 workflow_dispatch 手动补打。
on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag-and-release:
    name: 按 VERSION 打 tag 并创建 Release
    # 自动触发时要求：PR 已合并，且来源分支是 dev。
    # 手动触发不受此限制，用于发布失败后的补救。
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # PR 合并时检出合并提交；手动触发时取触发分支的最新提交。
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
          # 生成变更说明需要完整历史与标签。
          fetch-depth: 0

      - name: 读取版本号
        id: version
        run: |
          set -euo pipefail
          if [ ! -f VERSION ]; then
            echo "未找到 VERSION 文件，跳过。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          raw="$(tr -d '[:space:]' < VERSION)"
          tag="v${raw#[vV]}"
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9a-z.]+)?$'; then
            echo "VERSION 内容「${raw}」不是合法版本号，跳过。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "VERSION 声明的版本：${raw}，对应标签 ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 打 tag 并创建 Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "标签 ${TAG} 已存在，跳过，避免重复发布。"
            exit 0
          fi
          # 打附注 tag 需要提交者身份，Actions 环境默认没有配置，这里显式指定。
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}：由 VERSION 文件声明"
          git push origin "${TAG}"
          # 由 GITHUB_TOKEN 推送的标签不会再次触发 Release 工作流，
          # 因此在这里直接创建 Release。
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            --verify-tag
          echo "已发布 ${TAG}"
