name: Release

# 打 v* 标签时先跑一遍校验，再生成 Release 与自动变更说明。
# 本项目是公共基础库，不产出二进制，Release 只用于标记版本与汇总变更。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 发布前校验
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          # 项目当前无第三方依赖，没有 go.sum；用 go.mod 作为缓存键，避免缓存步骤告警。
          cache-dependency-path: go.mod

      - name: 格式检查
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未按 gofmt 格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: 静态检查
        run: go vet ./...

      - name: 单元测试
        run: go test -race ./...

  release:
    name: 创建 Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 生成变更说明需要完整历史与标签。
          fetch-depth: 0

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
